name: Build OpenEUICC APKs

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build OpenEUICC (${{ matrix.arch.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - abi: "armeabi-v7a"
            name: "v7"
          - abi: "arm64-v8a"
            name: "v8"
          - abi: "armeabi-v7a,arm64-v8a"
            name: "arm"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore File (User Secrets)
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo "Decoding user keystore..."
            echo "$KEYSTORE_FILE_BASE64" | base64 -d > release.keystore
          else
            echo "No user keystore secret provided."
          fi

      - name: Decode Keystore Properties (User Secrets)
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "Writing keystore.properties..."
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          else
            echo "Skipping keystore.properties writing."
          fi

      - name: Generate Temporary Keystore (Fallback)
        run: |
          if [ ! -f keystore.properties ]; then
            echo "No keystore.properties found. Generating temporary fallback keystore..."
            keytool -genkeypair -v -keystore keystore.jks -alias openeuicc-key -keyalg RSA -keysize 2048 -validity 10000 -storepass tempStorePass123 -keypass tempStorePass123 -dname "CN=OpenEUICC, O=OpenEUICC, C=US"
            keytool -genkeypair -v -keystore keystore.jks -alias easyeuicc-key -keyalg RSA -keysize 2048 -validity 10000 -storepass tempStorePass123 -keypass tempStorePass123 -dname "CN=EasyEUICC, O=EasyEUICC, C=US"
            
            echo "storePassword=tempStorePass123" > keystore.properties
            echo "keyPassword=tempStorePass123" >> keystore.properties
            echo "keyAlias=openeuicc-key" >> keystore.properties
            echo "unprivKeyPassword=tempStorePass123" >> keystore.properties
            echo "unprivKeyAlias=easyeuicc-key" >> keystore.properties
            echo "storeFile=../keystore.jks" >> keystore.properties
          else
            echo "Using user keystore.properties. Fallback skipped."
          fi

      - name: Build Debug APK & Magisk Module
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app-unpriv:assembleDebug :app:assembleDebugMagiskModule -Pandroid.injected.build.abi=${{ matrix.arch.abi }}

      - name: Build Release APK & Magisk Module
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app-unpriv:assembleRelease :app:assembleReleaseMagiskModule -Pandroid.injected.build.abi=${{ matrix.arch.abi }}

      - name: Organize Artifacts
        run: |
          mkdir -p build-artifacts
          
          # Copy OpenEUICC debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/OpenEUICC-${{ matrix.arch.name }}-debug.apk
          fi
          
          # Copy OpenEUICC release APK (signed or unsigned)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/OpenEUICC-${{ matrix.arch.name }}-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/OpenEUICC-${{ matrix.arch.name }}-release-unsigned.apk
          fi
          
          # Copy OpenEUICC Magisk debug module
          if [ -f app/build/magisk/magisk-debug.zip ]; then
            cp app/build/magisk/magisk-debug.zip build-artifacts/OpenEUICC-${{ matrix.arch.name }}-magisk-debug.zip
          fi
          
          # Copy OpenEUICC Magisk release module
          if [ -f app/build/magisk/magisk-release.zip ]; then
            cp app/build/magisk/magisk-release.zip build-artifacts/OpenEUICC-${{ matrix.arch.name }}-magisk-release.zip
          fi

          # Copy EasyEUICC debug APK
          if [ -f app-unpriv/build/outputs/apk/debug/app-unpriv-debug.apk ]; then
            cp app-unpriv/build/outputs/apk/debug/app-unpriv-debug.apk build-artifacts/EasyEUICC-${{ matrix.arch.name }}-debug.apk
          fi
          
          # Copy EasyEUICC release APK (signed or unsigned)
          if [ -f app-unpriv/build/outputs/apk/release/app-unpriv-release.apk ]; then
            cp app-unpriv/build/outputs/apk/release/app-unpriv-release.apk build-artifacts/EasyEUICC-${{ matrix.arch.name }}-release.apk
          elif [ -f app-unpriv/build/outputs/apk/release/app-unpriv-release-unsigned.apk ]; then
            cp app-unpriv/build/outputs/apk/release/app-unpriv-release-unsigned.apk build-artifacts/EasyEUICC-${{ matrix.arch.name }}-release-unsigned.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenEUICC-${{ matrix.arch.name }}
          path: build-artifacts/*
